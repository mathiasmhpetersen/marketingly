<head>

<!-- Performance: preconnect + preload hero poster -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://use.typekit.net">
<link rel="preconnect" href="https://i.ytimg.com">

<link rel="preload" as="image" href="https://i.ytimg.com/vi/hRVRtHOxXrM/maxresdefault.jpg" fetchpriority="high">

<!-- Real Warberg fonts (Adobe Typekit kit ufy7uiz) — may be domain-locked.
     Google Font fallbacks (Oswald + Inter) match the comedy-poster + humanist feel. -->
<link rel="stylesheet" href="https://use.typekit.net/ufy7uiz.css">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ─────────────────────────────────────────────────────────────
   EDIT-ME CONSTANTS
   - TICKET_URL : the live billet URL — set below in the <script>
   - YOUTUBE_ID : the embedded show video ID — set below in the <script>
   ───────────────────────────────────────────────────────────── */

*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Real Warberg brand palette, lifted from his theme CSS */
  --bg:#ffffff;
  --paper:#f7f9fb;
  --ink:#0f172a;
  --ink-soft:#334155;
  --muted:#64748b;
  --blue:#007cc6;
  --blue-l:#0091c7;
  --blue-d:#155b79;
  --navy:#003367;
  --pink:#ef5587;
  --line:rgba(15,23,42,0.10);
}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:'massilia','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:1.55;font-weight:400;
  overflow-x:hidden;min-height:100vh;position:relative;
}

/* Subtle paper grain — keeps the comedy-poster feel without going dark/SaaS */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:0.035;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:40px 22px 56px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
@media(min-width:768px){main{padding:56px 32px 72px}}

/* ─── HEADLINE / POSTER ─── */
.eyebrow{
  font-family:'pilsner','Oswald',Impact,sans-serif;
  font-weight:700;
  font-size:clamp(13px,1.6vw,16px);
  letter-spacing:0.32em;
  color:var(--blue);
  text-transform:uppercase;
  margin-bottom:14px;text-align:center;
}
h1{
  font-family:'pilsner','Oswald',Impact,sans-serif;
  font-weight:700;
  font-size:clamp(40px,8.5vw,96px);
  line-height:0.92;
  letter-spacing:-0.005em;
  text-transform:uppercase;
  text-align:center;
  color:var(--navy);
  margin:0 auto 32px;
  max-width:14ch;
  text-wrap:balance;
}
h1 .q{color:var(--blue);font-weight:700}
@media(min-width:768px){h1{margin-bottom:44px;max-width:16ch}}

/* ─── VIDEO with brand radial-gradient frame ─── */
.video-frame{
  width:100%;max-width:980px;margin:0 auto;
  padding:14px;border-radius:6px;position:relative;
  background:radial-gradient(circle at 50% 50%, #0091c7 0%, #007cc6 55%, #155b79 100%);
  box-shadow:0 30px 80px -24px rgba(0,51,103,0.45), 0 2px 0 rgba(255,255,255,0.4) inset;
}
@media(min-width:768px){.video-frame{padding:18px}}
.video{
  position:relative;width:100%;aspect-ratio:16/9;background:#000;
  border-radius:3px;overflow:hidden;cursor:pointer;
  box-shadow:0 0 0 1px rgba(0,0,0,0.5), 0 20px 50px -10px rgba(0,0,0,0.4);
}
.video img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform 0.6s cubic-bezier(.2,.6,.2,1), filter 0.3s ease;
  filter:brightness(0.92) saturate(1.04);
}
.video:hover img{transform:scale(1.02);filter:brightness(1) saturate(1.05)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:96px;height:96px;border-radius:50%;
  background:#fff;color:var(--blue);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 10px rgba(255,255,255,0.18), 0 20px 50px rgba(0,0,0,0.45);
  transition:transform 0.25s ease, box-shadow 0.25s ease;
  z-index:2;
}
.video:hover .play{transform:translate(-50%,-50%) scale(1.06);box-shadow:0 0 0 12px rgba(255,255,255,0.25), 0 24px 60px rgba(0,0,0,0.5)}
.play svg{width:34px;height:34px;fill:currentColor;margin-left:5px}
.play-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,0.6);animation:ping 2.6s ease-out infinite;z-index:1}
@keyframes ping{0%{transform:scale(1);opacity:0.85}100%{transform:scale(1.5);opacity:0}}
.video-tag{
  position:absolute;bottom:14px;left:14px;
  background:rgba(0,51,103,0.85);backdrop-filter:blur(8px);
  color:#fff;font-family:'pilsner','Oswald',sans-serif;font-weight:700;
  font-size:11px;letter-spacing:0.16em;text-transform:uppercase;
  padding:6px 11px;border-radius:3px;z-index:2;pointer-events:none;
}
@media(max-width:520px){
  .play{width:68px;height:68px}
  .play svg{width:24px;height:24px;margin-left:3px}
  .video-frame{padding:10px}
}

/* ─── CTA BLOCK ─── */
.cta{margin-top:40px;text-align:center;max-width:680px}
@media(min-width:768px){.cta{margin-top:56px}}
.cta-line{
  font-family:'massilia','Inter',sans-serif;font-weight:500;
  font-size:clamp(17px,2.4vw,22px);line-height:1.4;
  color:var(--ink);margin-bottom:24px;text-wrap:balance;
}
.cta-line strong{font-weight:700;color:var(--navy)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:14px;
  background:var(--blue);color:#fff;
  font-family:'pilsner','Oswald',Impact,sans-serif;
  font-size:clamp(20px,2.6vw,26px);font-weight:700;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:22px 44px;border-radius:4px;
  text-decoration:none;border:none;cursor:pointer;
  box-shadow:0 14px 40px -8px rgba(0,124,198,0.55), inset 0 -3px 0 rgba(0,0,0,0.15);
  transition:transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  min-width:280px;
}
.btn:hover{background:var(--blue-l);transform:translateY(-2px);box-shadow:0 20px 50px -6px rgba(0,124,198,0.65), inset 0 -3px 0 rgba(0,0,0,0.18)}
.btn:active{transform:translateY(0)}
.btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ─── CRITIC STARS (Warberg uses these on his real site) ─── */
.stars{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:8px}
.stars-row{display:flex;gap:3px;color:var(--blue)}
.stars-row svg{width:18px;height:18px;fill:currentColor}
.stars-cap{font-family:'massilia','Inter',sans-serif;font-size:12px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;font-weight:600}

/* ─── FOOTER ─── */
footer{margin-top:auto;padding-top:64px;width:100%;display:flex;justify-content:center}
.wordmark{
  font-family:'pilsner','Oswald',Impact,sans-serif;
  font-size:18px;letter-spacing:0.4em;
  color:var(--blue);text-transform:uppercase;text-decoration:none;font-weight:700;
}
</style>
</head>
<body>

<main>

  <div class="eyebrow">Fuldt show · Optaget live</div>
  <h1><span class="q">"</span>Perfektion, overskud<br>og andre lorteord<span class="q">"</span></h1>

  <div class="video-frame">
    <div class="video" id="video" data-id="hRVRtHOxXrM" role="button" aria-label='Afspil show: "Perfektion, overskud og andre lorteord"' tabindex="0">
      <img src="https://i.ytimg.com/vi/hRVRtHOxXrM/maxresdefault.jpg"
           alt='Thomas Warberg — "Perfektion, overskud og andre lorteord"'
           loading="eager" decoding="async" fetchpriority="high"
           onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/hRVRtHOxXrM/hqdefault.jpg'">
      <span class="play" aria-hidden="true">
        <span class="play-ring"></span>
        <svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>
      </span>
      <span class="video-tag">Fuldt show</span>
    </div>
  </div>

  <section class="cta">
    <p class="cta-line">Skal du ind og have en uforglemmelig aften?<br><strong>Find billetter til mit nye show her.</strong></p>
    <a id="ticketBtn" class="btn" href="#TICKET_URL_TODO" target="_blank" rel="noopener">
      Find billetter
      <svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </a>

    <div class="stars" aria-label="Anmelderstjerner">
      <div class="stars-row">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>
      </div>
      <div class="stars-cap">Scenekanten · iScene · Magasinet KBH</div>
    </div>
  </section>

  <footer>
    <span class="wordmark">Thomas Warberg</span>
  </footer>

</main>

<script>
/* ─────────────────────────────────────────────────────────────
   EDIT ME
   ───────────────────────────────────────────────────────────── */
const TICKET_URL = "TODO_TICKET_URL"; // ← paste the live billet URL here
const YOUTUBE_ID = "hRVRtHOxXrM";

/* Wire the button */
(function(){
  const btn = document.getElementById("ticketBtn");
  if (TICKET_URL && TICKET_URL !== "TODO_TICKET_URL") btn.href = TICKET_URL;
})();

/* Lazy YouTube — swap the poster for the iframe only on click.
   Keeps LCP fast: zero YT JS until the visitor signals intent. */
(function(){
  const el = document.getElementById("video");
  function load(){
    const id = el.dataset.id || YOUTUBE_ID;
    const iframe = document.createElement("iframe");
    iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`;
    iframe.title = 'Thomas Warberg — Perfektion, overskud og andre lorteord';
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    iframe.allowFullscreen = true;
    el.innerHTML = "";
    el.appendChild(iframe);
    el.style.cursor = "default";
  }
  el.addEventListener("click", load);
  el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); load(); } });
})();
</script>

</body>
</html>
